name: iPhone Duo Restock

# Each run watches for ~9 minutes, then a new run takes over. GitHub may start
# scheduled runs late, so short gaps are possible.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: duo-restock
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/iphone-duo-restock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Watch Munich stores
        working-directory: tools/iphone-duo-restock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_URL: ${{ vars.PRODUCT_URL || 'https://www.apple.com/de/shop/buy-iphone/iphone-duo' }}
          CAPACITIES: '256,512'
          STORE_MATCH: München
          LOCATION: '80331'
          INTERVAL_SEC: '90'
          MAX_RUNTIME_SEC: '540'
        run: node restock.mjs
